server.port = ${PORT:36519}

logging.level.org.atmosphere = warn
#logging.level.org.springframework.security=DEBUG
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,dev.hilla,br.ufrj.cos,com.github.appreciated.apexcharts,org.vaadin.addons.visjs.network.main,com/mysoftware,org/vaadin,com/vaadin,com/wontlost


# H2 database configuration
spring.datasource.url=jdbc:h2:file:./database/archiotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=archiotdb
spring.datasource.password=
#spring.sql.init.data-locations=./database/all-data.sql

# H2 console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA and Hibernate configuration
spring.jpa.defer-datasource-initialization = true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.open-in-view=true

server.servlet.session.timeout=3600
spring.session.timeout=3600

api.url=http://localhost:8000

# Google Gemini API Key (get a new one at https://aistudio.google.com/apikey)
# Standard AI Studio keys start with "AIza" and have higher free-tier quotas
google.api.key=${GOOGLE_API_KEY:}

# Spring Multipart Upload Configuration (for ISO standards and PDF reference documents)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB